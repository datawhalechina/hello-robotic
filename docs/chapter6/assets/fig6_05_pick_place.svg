<text x="40" y="54" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#18334B" text-anchor="start">图 6-5｜抓放分阶段：先抬起，再搬运，最后等它落稳</text>
<text x="40" y="94" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#61758A" text-anchor="start">横向表示任务进程，不是世界 x；高度按配置标注。连线连接目标，不代表 relative_joint 的实际路径。</text>
