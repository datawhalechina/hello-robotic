<text x="1065" y="581" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#2866B4" text-anchor="middle">落稳中心 ≈ 0.928 m</text>
<text x="282" y="566" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#D74B4B" text-anchor="start">红块中心 0.920 m</text>
<rect x="40" y="645" width="420" height="190" rx="16" fill="white" stroke="#168477" stroke-width="2"/>
<text x="60" y="680" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#168477" text-anchor="start">先确认真的拿起来</text>
<text x="60" y="715" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">默认抬升目标：0.160 m</text>
<text x="60" y="745" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">实际抬升 ≥ 0.096 m</text>
<text x="60" y="775" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">红块与 TCP 距离 ≤ 0.090 m</text>
<rect x="500" y="645" width="420" height="190" rx="16" fill="white" stroke="#2866B4" stroke-width="2"/>
<text x="520" y="680" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#2866B4" text-anchor="start">再确认整块落入框内</text>
<text x="520" y="715" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">不是只检查红块中心</text>
<text x="520" y="745" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">底部接近框底板，速度足够小</text>
<text x="520" y="775" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">退出后等待，并连续验收 0.5 s</text>
<rect x="960" y="645" width="440" height="190" rx="16" fill="white" stroke="#C57926" stroke-width="2"/>
<text x="980" y="680" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#C57926" text-anchor="start">两种模式从哪里开始不同</text>
<text x="980" y="715" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">HOME 与预抓取：均用关节模式</text>
<text x="980" y="745" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">下探 / 抬升 / 搬运 / 下放 / 退出：</text>
<text x="980" y="775" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#18334B" text-anchor="start">使用命令行选择的模式</text>
<text x="40" y="912" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#61758A" text-anchor="start">框上方 z = 0.940 + 0.160 = 1.100 m，比红块上方高 0.020 m；搬运目标并非严格等高。</text>
<text x="40" y="940" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#61758A" text-anchor="start">释放 TCP 高度 0.940 m ≠ 最终方块中心高度 0.928 m；方块靠真实接触和重力完成抓放。</text>
